<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MageButler harness</title>
<script src="https://cdn.jsdelivr.net/npm/luaparse@0.3.1/luaparse.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>
</head>
<body>
<pre id="out">ready</pre>
<script>
async function text(url) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error(url + " -> " + response.status);
  return await response.text();
}

async function runHarness() {
  const out = { syntax: [], log: [], nonAscii: [] };
  const toc = await text("/addon/MageButler.toc");
  const files = toc.split(/\r?\n/).map(s => s.trim()).filter(s => s && !s.startsWith("#"));
  window.FILES = files;
  window.SOURCES = {};
  window.LOG = out.log;

  for (const file of files) {
    const source = await text("/addon/" + file);
    window.SOURCES[file] = source;
    try {
      luaparse.parse(source, { luaVersion: "5.1" });
      out.syntax.push(file + ": OK");
    } catch (error) {
      out.syntax.push(file + ": " + error.message);
    }
    const lines = source.split(/\r?\n/);
    lines.forEach((line, index) => {
      if (/[^\x00-\x7F]/.test(line)) out.nonAscii.push(file + ":" + (index + 1));
    });
  }

  window.MOCK = await text("/mock.lua");
  window.TEST = await text("/test.lua");
  try {
    fengari.load(`
      local js = require "js"
      local w = js.global
      local chunk, err = load(w.MOCK, "@mock.lua")
      if not chunk then error(err) end
      chunk()
      chunk, err = load(w.TEST, "@test.lua")
      if not chunk then error(err) end
      chunk()
    `)();
  } catch (error) {
    out.log.push("HARNESS ERROR: " + error);
  }
  document.getElementById("out").textContent = JSON.stringify(out, null, 2);
  return out;
}
</script>
</body>
</html>
